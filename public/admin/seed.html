    async function startSeeding() {
      const btn = document.getElementById('seedBtn');
      const statusBox = document.getElementById('seedStatus');
      const logList = document.getElementById('logList');
      btn.disabled = true; btn.textContent = 'Memproses Impor Data...';
      statusBox.style.display = 'block';
      logList.innerHTML = '';

      function addLog(msg) {
        const li = document.createElement('li');
        li.innerHTML = msg;
        logList.appendChild(li);
      }

      try {
        addLog('Mengimpor data Berita (9 Artikel)... ⏳');
        await db.ref('berita').set(initialData.berita);
        addLog('✅ <strong>Berita</strong> berhasil diimpor!');

        addLog('Mengimpor data Galeri Foto... ⏳');
        await db.ref('galeri').set(initialData.galeri);
        addLog('✅ <strong>Galeri Foto</strong> berhasil diimpor!');

        addLog('Mengimpor Profil Pengurus... ⏳');
        await db.ref('pengurus').set(initialData.pengurus);
        addLog('✅ <strong>Profil Pengurus</strong> berhasil diimpor!');

        addLog('Mengimpor Unit Pendidikan... ⏳');
        await db.ref('unitPendidikan').set(initialData.unitPendidikan);
        addLog('✅ <strong>Unit Pendidikan</strong> berhasil diimpor!');

        addLog('Mengimpor Tentang Kami (Sejarah & Visi Misi)... ⏳');
        await db.ref('tentang').set(initialData.tentang);
        addLog('✅ <strong>Tentang Kami</strong> berhasil diimpor!');

        addLog('Mengimpor Pengaturan Beranda... ⏳');
        await db.ref('beranda').set(initialData.beranda);
        addLog('✅ <strong>Pengaturan Beranda</strong> berhasil diimpor!');

        addLog('Mengimpor Pengaturan Header & Footer... ⏳');
        await db.ref('header_footer').set(initialData.header_footer);
        addLog('✅ <strong>Header & Footer</strong> berhasil diimpor!');

        addLog('<br><strong style="color:#107163;font-size:14px;">🎉 Seluruh data bawaan berhasil diimpor ke Firebase!</strong>');
        btn.style.background = '#059669';
        btn.textContent = '✅ Selesai! Kembali ke Dashboard';
        btn.disabled = false;
        btn.onclick = () => { window.location.href = 'index.html'; };
      } catch (err) {
        addLog(`<span style="color:#e53e3e">❌ Gagal mengimpor: ${err.message}</span>`);
        btn.disabled = false; btn.textContent = 'Coba Lagi';
      }
