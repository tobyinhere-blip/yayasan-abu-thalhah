<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Profil Pengurus - Admin Yayasan Abu Thalhah</title>
  <link rel="icon" href="../logo_yayasan.png" type="image/png">
  <link rel="stylesheet" href="css/admin.css">
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
</head>
<body>
  <div id="sidebarContainer"></div>
  <div class="admin-main">
    <header class="admin-topbar">
      <div>
        <div class="topbar-title">Profil Pengurus</div>
        <span class="topbar-breadcrumb">Dashboard / Pengurus</span>
      </div>
      <button class="btn btn-primary" onclick="openModal()">
        <svg fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg>
        Tambah Pengurus
      </button>
    </header>
    <div class="admin-content">
      <div class="admin-card">
        <div class="admin-card-header">
          <div class="admin-card-title">Daftar Pengurus Yayasan</div>
          <span class="badge badge-blue" id="countBadge">0 pengurus</span>
        </div>
        <div class="admin-card-body">
          <div id="loadingState" class="loading-spinner"><div class="spinner"></div></div>
          <table class="admin-table" id="pengurusTable" style="display:none">
            <thead>
              <tr>
                <th style="width:60px">Foto</th>
                <th>Nama</th>
                <th>Jabatan</th>
                <th style="width:80px">Urutan</th>
                <th style="width:100px">Aksi</th>
              </tr>
            </thead>
            <tbody id="pengurusBody"></tbody>
          </table>
          <div id="emptyState" class="empty-state" style="display:none">
            <svg fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
            <p>Belum ada data pengurus.</p>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Add/Edit Modal -->
  <div class="modal-overlay" id="pengurusModal" style="display:none">
    <div class="modal" style="max-width:480px">
      <div class="modal-header">
        <div class="modal-title" id="modalTitle">Tambah Pengurus</div>
        <button onclick="closeModal()" class="btn-icon"><svg fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg></button>
      </div>
      <div class="modal-body">
        <div class="form-grid" style="gap:14px;">
          <div class="form-group">
            <label class="form-label">Nama Lengkap <span class="required">*</span></label>
            <input type="text" id="namaInput" class="form-input" placeholder="Nama pengurus...">
          </div>
          <div class="form-group">
            <label class="form-label">Jabatan <span class="required">*</span></label>
            <input type="text" id="jabatanInput" class="form-input" placeholder="Ketua Yayasan, Sekretaris, dll...">
          </div>
          <div class="form-group">
            <label class="form-label">URL Foto</label>
            <input type="text" id="fotoInput" class="form-input" placeholder="https://..." oninput="previewPengurusFoto()">
            <div class="img-preview-box" id="pengurusPreview" style="min-height:80px;margin-top:8px;">
              <span style="color:#94a8a5;font-size:13px;">Preview foto</span>
            </div>
          </div>
          <div class="form-group">
            <label class="form-label">Urutan Tampil</label>
            <input type="number" id="urutanInput" class="form-input" value="1" min="1">
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <button onclick="closeModal()" class="btn btn-outline">Batal</button>
        <button onclick="savePengurus()" class="btn btn-primary" id="savePengurusBtn">Simpan</button>
      </div>
    </div>
  </div>

  <script src="js/firebase-config.js"></script>
  <script src="js/sidebar.js"></script>
  <script src="js/auth.js"></script>
  <script>
    injectSidebar('pengurus');
    let editId = null;

    db.ref('pengurus').on('value', snap => {
      document.getElementById('loadingState').style.display = 'none';
      const tbody = document.getElementById('pengurusBody');
      const tableEl = document.getElementById('pengurusTable');
      const emptyEl = document.getElementById('emptyState');
      tbody.innerHTML = '';

      if (!snap.exists()) {
        document.getElementById('countBadge').textContent = '0 pengurus';
        tableEl.style.display = 'none'; emptyEl.style.display = 'block'; return;
      }

      const items = Object.entries(snap.val()).sort((a,b) => (a[1].urutan||99)-(b[1].urutan||99));
      document.getElementById('countBadge').textContent = `${items.length} pengurus`;
      emptyEl.style.display = 'none'; tableEl.style.display = 'table';

      items.forEach(([id, p]) => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td><img class="table-img" src="${fixAdminImgUrl(p.foto)}" alt="" style="border-radius:50%;width:44px;height:44px;" onerror="this.src='../logo_yayasan.png'"></td>
          <td style="font-weight:600">${p.nama||'-'}</td>
          <td><span class="badge badge-blue">${p.jabatan||'-'}</span></td>
          <td style="text-align:center;color:#94a8a5">${p.urutan||1}</td>
          <td>
            <div style="display:flex;gap:6px;">
              <button class="btn-icon" onclick="openEditModal('${id}')"><svg fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/></svg></button>
              <button class="btn-icon danger" onclick="doDelete('${id}')"><svg fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg></button>
            </div>
          </td>
        `;
        tbody.appendChild(tr);
      });
    });

    function openModal() {
      editId = null;
      document.getElementById('modalTitle').textContent = 'Tambah Pengurus';
      document.getElementById('namaInput').value = '';
      document.getElementById('jabatanInput').value = '';
      document.getElementById('fotoInput').value = '';
      document.getElementById('urutanInput').value = '1';
      document.getElementById('pengurusPreview').innerHTML = '<span style="color:#94a8a5;font-size:13px;">Preview foto</span>';
      document.getElementById('pengurusModal').style.display = 'flex';
    }

    function openEditModal(id) {
      editId = id;
      document.getElementById('modalTitle').textContent = 'Edit Pengurus';
      db.ref(`pengurus/${id}`).once('value').then(snap => {
        const p = snap.val();
        document.getElementById('namaInput').value = p.nama || '';
        document.getElementById('jabatanInput').value = p.jabatan || '';
        document.getElementById('fotoInput').value = p.foto || '';
        document.getElementById('urutanInput').value = p.urutan || 1;
        previewPengurusFoto();
      });
      document.getElementById('pengurusModal').style.display = 'flex';
    }

    function closeModal() { document.getElementById('pengurusModal').style.display = 'none'; }

    function previewPengurusFoto() {
      const url = document.getElementById('fotoInput').value.trim();
      const box = document.getElementById('pengurusPreview');
      box.innerHTML = url ? `<img src="${url}" style="max-height:80px;border-radius:50%;object-fit:cover;" onerror="this.parentElement.innerHTML='<span style=color:#e53e3e;font-size:12px>Tidak dapat dimuat</span>'">` : '<span style="color:#94a8a5;font-size:13px;">Preview foto</span>';
    }

    async function savePengurus() {
      const nama = document.getElementById('namaInput').value.trim();
      const jabatan = document.getElementById('jabatanInput').value.trim();
      if (!nama || !jabatan) { showToast('Nama dan jabatan wajib diisi!', 'error'); return; }
      const btn = document.getElementById('savePengurusBtn');
      btn.disabled = true; btn.textContent = 'Menyimpan...';
      const payload = { nama, jabatan, foto: document.getElementById('fotoInput').value.trim(), urutan: parseInt(document.getElementById('urutanInput').value) || 1, createdAt: Date.now() };
      try {
        if (editId) await db.ref(`pengurus/${editId}`).update(payload);
        else await db.ref('pengurus').push(payload);
        showToast(editId ? 'Pengurus berhasil diupdate!' : 'Pengurus berhasil ditambahkan!');
        closeModal();
      } catch(err) { showToast('Gagal: ' + err.message, 'error'); }
      btn.disabled = false; btn.textContent = 'Simpan';
    }

    function doDelete(id) {
      if (confirm('Yakin ingin menghapus data pengurus ini?')) {
        db.ref(`pengurus/${id}`).remove().then(() => showToast('Pengurus berhasil dihapus.'));
      }
    }
  </script>
</body>
</html>
