<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Setup Admin - Yayasan Abu Thalhah</title>
  <link rel="stylesheet" href="css/admin.css">
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
</head>
<body style="background:linear-gradient(135deg,#0a2e28 0%,#107163 60%,#1a9482 100%);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;">
  <div style="background:#fff;border-radius:20px;box-shadow:0 24px 64px rgba(0,0,0,0.3);width:100%;max-width:460px;padding:44px 40px;">
    <div style="text-align:center;margin-bottom:32px;">
      <img src="../logo_yayasan.png" style="width:60px;height:60px;object-fit:contain;margin-bottom:12px;" onerror="this.style.display='none'">
      <h1 style="font-family:'Plus Jakarta Sans',sans-serif;font-size:22px;font-weight:800;color:#1a2e2b;">Setup Admin Pertama</h1>
      <p style="font-size:13px;color:#94a8a5;margin-top:8px;">Buat akun admin untuk pertama kali. Halaman ini hanya digunakan sekali.</p>
    </div>

    <div id="form">
      <div class="form-group" style="margin-bottom:16px;">
        <label class="form-label">Email Admin</label>
        <input type="email" id="emailInput" class="form-input" value="admin@yayasan.com">
      </div>
      <div class="form-group" style="margin-bottom:16px;">
        <label class="form-label">Password Admin</label>
        <input type="password" id="passInput" class="form-input" value="yayasansukses">
      </div>
      <div class="form-group" style="margin-bottom:24px;">
        <label class="form-label">Konfirmasi Password</label>
        <input type="password" id="pass2Input" class="form-input" value="yayasansukses">
      </div>
      <button onclick="createAdmin()" style="width:100%;padding:13px;background:#107163;color:#fff;border:none;border-radius:8px;font-size:15px;font-weight:700;cursor:pointer;font-family:'Plus Jakarta Sans',sans-serif;" id="createBtn">
        Buat Akun Admin
      </button>
    </div>

    <div id="result" style="display:none;text-align:center;padding:20px;">
      <div style="font-size:48px;margin-bottom:12px;">✅</div>
      <div style="font-family:'Plus Jakarta Sans',sans-serif;font-size:18px;font-weight:700;color:#107163;margin-bottom:8px;">Akun Admin Berhasil Dibuat!</div>
      <p style="font-size:13px;color:#5a7572;margin-bottom:20px;">Akun dengan email <strong id="createdEmail"></strong> telah berhasil dibuat. Anda sekarang dapat login ke dashboard.</p>
      <p style="font-size:12px;color:#e53e3e;margin-bottom:20px;font-weight:600;">⚠️ Hapus file setup.html ini setelah selesai untuk keamanan!</p>
      <a href="login.html" style="display:inline-flex;align-items:center;gap:8px;padding:12px 24px;background:#107163;color:#fff;border-radius:8px;font-size:14px;font-weight:700;text-decoration:none;">Pergi ke Halaman Login →</a>
    </div>

    <div id="errorMsg" style="display:none;background:#fff5f5;color:#e53e3e;border:1px solid #fed7d7;border-radius:8px;padding:10px 14px;font-size:13px;margin-top:14px;"></div>
  </div>

  <script src="js/firebase-config.js"></script>
  <script>
    async function createAdmin() {
      const email = document.getElementById('emailInput').value.trim();
      const pass = document.getElementById('passInput').value;
      const pass2 = document.getElementById('pass2Input').value;
      const errEl = document.getElementById('errorMsg');
      errEl.style.display = 'none';

      if (!email || !pass) { errEl.textContent = 'Email dan password wajib diisi.'; errEl.style.display = 'block'; return; }
      if (pass !== pass2) { errEl.textContent = 'Konfirmasi password tidak cocok.'; errEl.style.display = 'block'; return; }
      if (pass.length < 6) { errEl.textContent = 'Password minimal 6 karakter.'; errEl.style.display = 'block'; return; }

      const btn = document.getElementById('createBtn');
      btn.textContent = 'Membuat akun...'; btn.disabled = true;

      try {
        await auth.createUserWithEmailAndPassword(email, pass);
        document.getElementById('createdEmail').textContent = email;
        document.getElementById('form').style.display = 'none';
        document.getElementById('result').style.display = 'block';
      } catch (err) {
        let msg = 'Gagal membuat akun: ' + err.message;
        if (err.code === 'auth/email-already-in-use') msg = 'Email ini sudah terdaftar. Silakan login langsung.';
        errEl.textContent = msg; errEl.style.display = 'block';
        btn.textContent = 'Buat Akun Admin'; btn.disabled = false;
      }
    }
  </script>
</body>
</html>
