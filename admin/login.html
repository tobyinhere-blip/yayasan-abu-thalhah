<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login Admin - Yayasan Islamic Center Abu Thalhah Al Anshari</title>
  <link rel="icon" href="../logo_yayasan.png" type="image/png">
  <link rel="stylesheet" href="css/admin.css">
  <!-- Firebase SDKs (compat) -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
</head>
<body class="login-page" style="display:block; background: linear-gradient(135deg,#0a2e28 0%,#107163 60%,#1a9482 100%);">

  <div style="min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px;">
    <div class="login-card">
      <div class="login-logo">
        <img src="../logo_yayasan.png" alt="Logo Yayasan" onerror="this.style.display='none'">
        <div>
          <div class="login-title">Dashboard Admin</div>
          <div class="login-subtitle">Yayasan Islamic Center Abu Thalhah Al Anshari</div>
        </div>
      </div>

      <form class="login-form" id="loginForm" onsubmit="doLogin(event)">
        <div class="form-group">
          <label class="form-label" for="email">Email</label>
          <input type="email" id="email" class="form-input" placeholder="admin@yayasan.com" required autocomplete="username">
        </div>
        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <input type="password" id="password" class="form-input" placeholder="••••••••" required autocomplete="current-password">
        </div>
        <button type="submit" class="login-submit" id="submitBtn">
          Masuk ke Dashboard
        </button>
        <div class="login-error" id="loginError"></div>
      </form>
    </div>
  </div>

  <script src="js/firebase-config.js"></script>
  <script>
    // Redirect if already logged in
    auth.onAuthStateChanged(user => {
      if (user) window.location.href = '/admin/';
    });

    async function doLogin(e) {
      e.preventDefault();
      const btn = document.getElementById('submitBtn');
      const errEl = document.getElementById('loginError');
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      btn.textContent = 'Memproses...';
      btn.disabled = true;
      errEl.style.display = 'none';

      try {
        await auth.signInWithEmailAndPassword(email, password);
        window.location.href = '/admin/';
      } catch (err) {
        let msg = 'Login gagal. Periksa email dan password Anda.';
        if (err.code === 'auth/user-not-found') msg = 'Akun tidak ditemukan.';
        else if (err.code === 'auth/wrong-password') msg = 'Password salah.';
        else if (err.code === 'auth/invalid-email') msg = 'Format email tidak valid.';
        else if (err.code === 'auth/too-many-requests') msg = 'Terlalu banyak percobaan. Coba lagi nanti.';
        errEl.textContent = msg;
        errEl.style.display = 'block';
        btn.textContent = 'Masuk ke Dashboard';
        btn.disabled = false;
      }
    }
  </script>
</body>
</html>
